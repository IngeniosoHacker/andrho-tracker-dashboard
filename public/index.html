<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebTracker · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark">◍</span>
        <span class="brand-name">WebTracker</span>
      </div>
      <p class="brand-sub">panel de sitios</p>
    </div>

    <div class="site-list" id="siteList">
      <!-- sites injected here -->
    </div>

    <button class="add-site-btn" id="addSiteBtn">
      <span>+</span> Agregar sitio
    </button>

    <div class="sidebar-foot">
      <span class="dot dot-ok"></span> conectado a la base de datos
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="main">
    <!-- Gate: shown when no site is selected / none saved -->
    <section class="gate" id="gate">
      <div class="gate-card">
        <p class="eyebrow">Acceso por Site ID</p>
        <h1>Entra a tu panel</h1>
        <p class="gate-copy">No usamos contraseña: si conoces el <code>site_id</code> del sitio, tienes acceso a sus métricas.</p>
        <form id="gateForm" autocomplete="off">
          <input id="gateInput" type="text" placeholder="ej. andrho" spellcheck="false" />
          <button type="submit">Entrar</button>
        </form>
        <p class="gate-error" id="gateError"></p>
      </div>
    </section>

    <!-- Dashboard (hidden until a site is active) -->
    <section class="dash" id="dash" hidden>
      <header class="dash-head">
        <div>
          <p class="eyebrow" id="activeSiteEyebrow">sitio activo</p>
          <h1 id="activeSiteName">—</h1>
        </div>
        <div class="dash-meta">
          <span id="lastActivity"></span>
        </div>
      </header>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="overview">Resumen</button>
        <button class="tab" data-tab="sessions">Sesiones</button>
        <button class="tab" data-tab="pages">Páginas</button>
        <button class="tab" data-tab="traffic">Tráfico &amp; Keywords</button>
        <button class="tab" data-tab="geo">Geografía</button>
        <button class="tab" data-tab="ai">Visibilidad IA</button>
      </nav>

      <div class="tab-panels" id="tabPanels">
        <div class="panel" id="panel-overview"></div>
        <div class="panel" id="panel-sessions" hidden></div>
        <div class="panel" id="panel-pages" hidden></div>
        <div class="panel" id="panel-traffic" hidden></div>
        <div class="panel" id="panel-geo" hidden></div>
        <div class="panel" id="panel-ai" hidden></div>
      </div>
    </section>
  </main>
</div>

<!-- Session detail drawer -->
<div class="drawer" id="drawer">
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="drawer-panel">
    <button class="drawer-close" id="drawerClose">✕</button>
    <div id="drawerContent"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
