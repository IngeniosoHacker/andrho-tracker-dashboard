<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AndRho · Panel</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="/images/logo/andrho-mark.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/styles.css" />
<script>
  // Theme before first paint (no white flash): the saved choice from the
  // theme button (js/theme.js), else the system's.
  (function () {
    var t = null;
    try { t = localStorage.getItem('andrho_theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>

<canvas class="starfield" id="starfield" aria-hidden="true"></canvas>

<div class="app">
  <!-- Left: every section of the dashboard (js/nav.js) -->
  <aside class="sidebar" id="sidebar" aria-label="Secciones">
    <a class="brand" href="/" aria-label="AndRho, ir al sitio">
      <img src="/images/logo/andrho-mark.png" alt="" />
      <span>AndRho</span>
    </a>
    <div class="side-account">
      <p class="side-company" id="companyName">—</p>
      <p class="side-user"><span id="userName">—</span> <span class="role-badge" id="roleBadge" hidden></span></p>
      <label class="side-status"><span class="status-dot" id="statusDot"></span>
        <select id="myStatus" aria-label="Tu estado">
          <option value="disponible">Disponible</option>
          <option value="almorzando">Almorzando</option>
          <option value="en_reunion">En reunión</option>
          <option value="en_ruta">En ruta</option>
          <option value="fuera">Fuera de turno</option>
        </select>
      </label>
    </div>
    <!-- The account's ERP: a progress ring while it's created, then opens it (js/erpstatus.js) -->
    <button class="erp-launch" id="erpLaunch" type="button" hidden></button>
    <nav class="side-nav" id="sideNav"></nav>
    <button class="side-link side-logout" id="logoutBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/></svg>
      <span>Cerrar sesión</span>
    </button>
  </aside>
  <div class="nav-backdrop" id="navBackdrop"></div>

  <!-- Center: the current section -->
  <main class="main" id="main">
    <header class="view-head">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="view-titles">
        <h1 id="viewTitle">—</h1>
        <p class="hint" id="viewHint"></p>
      </div>
      <div class="view-meta">
        <span id="lastActivity"></span>
        <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Modo oscuro" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn insights-toggle" id="insightsToggle" type="button" aria-label="Ver lo que dice AndRho" aria-controls="insights">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
          <span>AndRho</span>
        </button>
      </div>
    </header>
    <section class="view" id="view" aria-live="polite"></section>
  </main>

  <!-- Right: what AndRho reads in this section, and its suggestions (js/insights.js) -->
  <aside class="insights" id="insights" aria-label="Resumen y sugerencias de AndRho"></aside>
</div>

<!-- Side drawer (session detail, invite link, ...) -->
<div class="drawer" id="drawer">
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="drawer-panel" role="dialog" aria-modal="true">
    <button class="drawer-close" id="drawerClose" type="button" aria-label="Cerrar">✕</button>
    <div id="drawerContent"></div>
  </div>
</div>

<script>
  // Injected server-side (see src/server.js) from the ANDRHO_API_URL env var,
  // so the dashboard knows where to reach andrho-api.
  window.ANDRHO_API_URL = "__ANDRHO_API_URL__";
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/dashboard/starfield.js"></script>
<script type="module" src="/dashboard/js/main.js"></script>
</body>
</html>
