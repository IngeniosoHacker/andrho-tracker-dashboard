<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebTracker · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/styles.css" />
</head>
<body>

<div class="shell">

  <!-- Main -->
  <main class="main" id="main">
    <!-- Dashboard -->
    <section class="dash" id="dash">
      <header class="dash-head">
        <div>
          <p class="eyebrow" id="activeSiteEyebrow">cuenta</p>
          <h1 id="activeSiteName">—</h1>
        </div>
        <div class="dash-meta">
          <span class="role-badge" id="roleBadge" hidden></span>
          <span id="lastActivity"></span>
          <button class="logout-btn" id="logoutBtn" type="button">Cerrar sesión</button>
        </div>
      </header>

      <nav class="tabs top-tabs" id="topTabs">
        <button class="tab active" data-toptab="overview">Resumen <span class="tab-sub">Visibilidad</span></button>
        <button class="tab" data-toptab="performance">Rendimiento</button>
        <button class="tab" data-toptab="suggestions">Sugerencias</button>
        <button class="tab" data-toptab="updates">Actualizaciones</button>
        <button class="tab" data-toptab="today">Hoy</button>
        <button class="tab" data-toptab="settings">Configuración</button>
      </nav>

      <div class="top-panels" id="topPanels">

        <!-- ============ Resumen (Visibilidad) ============ -->
        <div class="top-panel" id="top-panel-overview">
          <div class="vtabs-layout">
            <nav class="vtabs-sidebar" id="overviewSubTabs">
              <button class="vtab active" data-subtab="marketing">Marketing</button>
              <button class="vtab" data-subtab="ventas">Ventas</button>
              <button class="vtab" data-subtab="inventarios">Inventarios</button>
              <button class="vtab" data-subtab="kpis">KPIs</button>
              <button class="vtab" data-subtab="web">Web</button>
            </nav>
            <div class="vtabs-content">
              <div class="panel" id="panel-overview-marketing"></div>
              <div class="panel" id="panel-overview-ventas" hidden></div>
              <div class="panel" id="panel-overview-inventarios" hidden></div>
              <div class="panel" id="panel-overview-kpis" hidden></div>
              <div class="panel" id="panel-overview-web" hidden>
                <div class="section-head">
                  <div>
                    <h2 style="margin:0">Web</h2>
                    <p class="hint" style="margin:4px 0 0">todas las vistas del rastreador de tu sitio -- sesiones, páginas, tráfico, geografía, IA y minijuego</p>
                  </div>
                  <button type="button" class="suggestions-btn" data-suggestions-section="web">💡 Sugerencias</button>
                </div>
                <nav class="tabs inner-tabs" id="webTabs">
                  <button class="tab active" data-innertab="resumen">Resumen</button>
                  <button class="tab" data-innertab="sessions">Sesiones</button>
                  <button class="tab" data-innertab="pages">Páginas</button>
                  <button class="tab" data-innertab="traffic">Tráfico &amp; Keywords</button>
                  <button class="tab" data-innertab="geo">Geografía</button>
                  <button class="tab" data-innertab="ai">Visibilidad IA</button>
                  <button class="tab" data-innertab="game">Minijuego</button>
                </nav>
                <div class="panel" id="panel-web-resumen"></div>
                <div class="panel" id="panel-web-sessions" hidden></div>
                <div class="panel" id="panel-web-pages" hidden></div>
                <div class="panel" id="panel-web-traffic" hidden></div>
                <div class="panel" id="panel-web-geo" hidden></div>
                <div class="panel" id="panel-web-ai" hidden></div>
                <div class="panel" id="panel-web-game" hidden></div>
              </div>
            </div>
          </div>
        </div>

        <!-- ============ Rendimiento ============ -->
        <div class="top-panel" id="top-panel-performance" hidden>
          <div class="vtabs-layout">
            <nav class="vtabs-sidebar" id="performanceSubTabs">
              <button class="vtab active" data-subtab="campanas">Campañas</button>
              <button class="vtab" data-subtab="ventas">Ventas</button>
              <button class="vtab" data-subtab="personal">Personal</button>
            </nav>
            <div class="vtabs-content">
              <div class="panel" id="panel-performance-campanas"></div>
              <div class="panel" id="panel-performance-ventas" hidden></div>
              <div class="panel" id="panel-performance-personal" hidden></div>
            </div>
          </div>
        </div>

        <!-- ============ Sugerencias (global) ============ -->
        <div class="top-panel" id="top-panel-suggestions" hidden>
          <div class="panel" id="panel-suggestions"></div>
        </div>

        <!-- ============ Actualizaciones ============ -->
        <div class="top-panel" id="top-panel-updates" hidden>
          <div class="panel" id="panel-updates"></div>
        </div>

        <!-- ============ Hoy ============ -->
        <div class="top-panel" id="top-panel-today" hidden>
          <div class="panel" id="panel-today"></div>
        </div>

        <!-- ============ Configuración ============ -->
        <div class="top-panel" id="top-panel-settings" hidden>
          <div class="panel" id="panel-settings"></div>
        </div>

      </div>
    </section>
  </main>
</div>

<!-- Generic side drawer (session detail, suggestions panel, invite link, ...) -->
<div class="drawer" id="drawer">
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="drawer-panel">
    <button class="drawer-close" id="drawerClose">✕</button>
    <div id="drawerContent"></div>
  </div>
</div>

<script>
  // Injected server-side (see src/server.js) from the ANDRHO_API_URL env var,
  // so app.js knows where to reach andrho-api for /auth/me, /auth/refresh,
  // /auth/logout, and the new /account/* and /suggestions endpoints.
  window.ANDRHO_API_URL = "__ANDRHO_API_URL__";
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/dashboard/app.js"></script>
</body>
</html>
