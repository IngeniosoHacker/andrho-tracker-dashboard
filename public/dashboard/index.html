<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebTracker · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/styles.css" />
</head>
<body>

<div class="shell">

  <!-- Main -->
  <main class="main" id="main">
    <!-- Dashboard -->
    <section class="dash" id="dash">
      <header class="dash-head">
        <div>
          <p class="eyebrow" id="activeSiteEyebrow">cuenta</p>
          <h1 id="activeSiteName">—</h1>
        </div>
        <div class="dash-meta">
          <span id="lastActivity"></span>
          <button class="logout-btn" id="logoutBtn" type="button">Cerrar sesión</button>
        </div>
      </header>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="overview">Resumen</button>
        <button class="tab" data-tab="sessions">Sesiones</button>
        <button class="tab" data-tab="pages">Páginas</button>
        <button class="tab" data-tab="traffic">Tráfico &amp; Keywords</button>
        <button class="tab" data-tab="geo">Geografía</button>
        <button class="tab" data-tab="ai">Visibilidad IA</button>
        <button class="tab" data-tab="game">Minijuego</button>
      </nav>

      <div class="tab-panels" id="tabPanels">
        <div class="panel" id="panel-overview"></div>
        <div class="panel" id="panel-sessions" hidden></div>
        <div class="panel" id="panel-pages" hidden></div>
        <div class="panel" id="panel-traffic" hidden></div>
        <div class="panel" id="panel-geo" hidden></div>
        <div class="panel" id="panel-ai" hidden></div>
        <div class="panel" id="panel-game" hidden></div>
      </div>
    </section>
  </main>
</div>

<!-- Session detail drawer -->
<div class="drawer" id="drawer">
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="drawer-panel">
    <button class="drawer-close" id="drawerClose">✕</button>
    <div id="drawerContent"></div>
  </div>
</div>

<script>
  // Injected server-side (see src/server.js) from the ANDRHO_API_URL env var,
  // so app.js knows where to reach andrho-api for /auth/me, /auth/refresh
  // and /auth/logout.
  window.ANDRHO_API_URL = "__ANDRHO_API_URL__";
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/dashboard/app.js"></script>
</body>
</html>
